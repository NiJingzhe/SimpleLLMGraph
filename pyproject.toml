[project]
name = "SimpleLLMFunc"
version = "0.1.0"
description = "A context-centric LLM framework with an explicit Step, Resolve, Reduce execution kernel."
authors = [{ name = "Ni Jingzhe", email = "nijingzhe@zju.edu.cn" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "openai>=2.0.0",
    "pydantic>=2.0.0",
]

[tool.poetry]
packages = [{ include = "SimpleLLMFunc", from = "." }]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "pyright>=1.1.409",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--cov=SimpleLLMFunc.cancellation --cov=SimpleLLMFunc.event --cov=SimpleLLMFunc.loop --cov-report=term-missing --cov-fail-under=100"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
